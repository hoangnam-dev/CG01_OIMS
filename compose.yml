name: oims

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${OIMS_POSTGRES_DB:-oims}
      POSTGRES_USER: ${OIMS_POSTGRES_USER:-oims}
      POSTGRES_PASSWORD: ${OIMS_POSTGRES_PASSWORD:?Set OIMS_POSTGRES_PASSWORD in .env}
    ports:
      - "${OIMS_INFRA_BIND_ADDRESS:-127.0.0.1}:${OIMS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - oims

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${OIMS_REDIS_PASSWORD:?Set OIMS_REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${OIMS_INFRA_BIND_ADDRESS:-127.0.0.1}:${OIMS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - oims

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${OIMS_RABBITMQ_USER:-oims}
      RABBITMQ_DEFAULT_PASS: ${OIMS_RABBITMQ_PASSWORD:?Set OIMS_RABBITMQ_PASSWORD in .env}
      OIMS_RABBITMQ_MAIN_QUEUE_MAX_LENGTH_BYTES: ${OIMS_RABBITMQ_MAIN_QUEUE_MAX_LENGTH_BYTES:-1048576}
      OIMS_RABBITMQ_RETRY_QUEUE_MAX_LENGTH_BYTES: ${OIMS_RABBITMQ_RETRY_QUEUE_MAX_LENGTH_BYTES:-1048576}
      OIMS_RABBITMQ_DEAD_LETTER_QUEUE_MAX_LENGTH_BYTES: ${OIMS_RABBITMQ_DEAD_LETTER_QUEUE_MAX_LENGTH_BYTES:-1048576}
      OIMS_RABBITMQ_MAX_MESSAGE_SIZE_BYTES: ${OIMS_RABBITMQ_MAX_MESSAGE_SIZE_BYTES:-1048576}
    ports:
      - "${OIMS_INFRA_BIND_ADDRESS:-127.0.0.1}:${OIMS_RABBITMQ_PORT:-5672}:5672"
      - "${OIMS_INFRA_BIND_ADDRESS:-127.0.0.1}:${OIMS_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
    post_start:
      - command:
          - sh
          - -ec
          - |
            for value in "$${OIMS_RABBITMQ_MAIN_QUEUE_MAX_LENGTH_BYTES}" "$${OIMS_RABBITMQ_RETRY_QUEUE_MAX_LENGTH_BYTES}" "$${OIMS_RABBITMQ_DEAD_LETTER_QUEUE_MAX_LENGTH_BYTES}"; do
              case "$${value}" in
                ''|*[!0-9]*) echo "RabbitMQ queue capacity values must be positive integers" >&2; exit 1 ;;
              esac
              [ "$${value}" -gt 0 ] || { echo "RabbitMQ queue capacity values must be positive integers" >&2; exit 1; }
            done
            remaining_startup_probes=120
            until rabbitmqctl await_startup >/dev/null 2>&1; do
              remaining_startup_probes=$$((remaining_startup_probes - 1))
              [ "$${remaining_startup_probes}" -gt 0 ] || { echo "RabbitMQ did not start before the policy import deadline" >&2; exit 1; }
              sleep 1
            done
            sed \
              -e "s/__OIMS_MAIN_QUEUE_MAX_LENGTH_BYTES__/$${OIMS_RABBITMQ_MAIN_QUEUE_MAX_LENGTH_BYTES}/g" \
              -e "s/__OIMS_RETRY_QUEUE_MAX_LENGTH_BYTES__/$${OIMS_RABBITMQ_RETRY_QUEUE_MAX_LENGTH_BYTES}/g" \
              -e "s/__OIMS_DEAD_LETTER_QUEUE_MAX_LENGTH_BYTES__/$${OIMS_RABBITMQ_DEAD_LETTER_QUEUE_MAX_LENGTH_BYTES}/g" \
              /etc/rabbitmq/definitions.template.json > /tmp/oims-rabbitmq-definitions.json
            rabbitmqctl import_definitions /tmp/oims-rabbitmq-definitions.json
        user: rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmqctl list_policies --formatter=json | grep -q oims-notification-order-created-retry"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - oims

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  oims:
    driver: bridge
